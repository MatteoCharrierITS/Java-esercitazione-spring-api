spring.application.name=liveauction-producer
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/liveauction}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=true

# Chiave di sviluppo: sostituire AUTH_JWT_SECRET in ogni ambiente condiviso.
app.auth.jwt-secret=${AUTH_JWT_SECRET:local-development-secret-change-before-deploying-2026}
app.auth.token-ttl=PT30M

# Avviando il Producer dalla sua directory, Spring Boot gestisce automaticamente
# il PostgreSQL definito nel Compose alla radice del repository.
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:true}
spring.docker.compose.file=${DOCKER_COMPOSE_FILE:../compose.yaml}
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.readiness.timeout=2m

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
